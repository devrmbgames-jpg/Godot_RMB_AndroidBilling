plugins {
    id 'org.jetbrains.kotlin.android'
    id 'com.android.library'
    id 'kotlin-android'
}

android {
    namespace "com.dtho47.godot.billing"
    compileSdk = 34
    buildToolsVersion = '34.0.0'

    defaultConfig {
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "1.3.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    def libName = project.property("library_name")
    defaultConfig {
        buildConfigField "String", "LIBRARY_NAME", "\"$libName\""
    }

    ndkVersion '23.2.8568313'

    libraryVariants.configureEach { variant ->
        variant.outputs.all { output ->
            output.outputFileName = "$libName.${variant.name}.aar"
        }
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    // Google Play Billing 9.1.0. The KTX artifact also supplies the coroutine helpers
    // used by queryPurchasesAsync in BillingService.
    implementation 'com.android.billingclient:billing-ktx:9.1.0'

    // Godot Android library must be supplied locally for the target Godot version.
    releaseCompileOnly fileTree(dir: 'libs/release', include: ['*.jar', '*.aar'])
    debugCompileOnly fileTree(dir: 'libs/debug', include: ['*.jar', '*.aar'])
}
