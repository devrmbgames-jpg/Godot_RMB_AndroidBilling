plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace "com.dtho47.godot.billing"
    compileSdk = 36
    buildToolsVersion = '35.0.0'

    defaultConfig {
        minSdk 23
        targetSdk 36
        versionCode 3
        versionName "1.3.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    def libName = project.property("library_name")
    defaultConfig {
        buildConfigField "String", "LIBRARY_NAME", "\"$libName\""
    }

    libraryVariants.configureEach { variant ->
        variant.outputs.all { output ->
            output.outputFileName = "$libName.${variant.name}.aar"
        }
    }

    buildFeatures {
        buildConfig true
    }
}

kotlin {
    jvmToolchain(17)
}

dependencies {
    // Billing 9.1.0 KTX is compiled with Kotlin 2.3 metadata. The project toolchain
    // intentionally uses Kotlin 2.3.21 / AGP 8.13.2 so the dependency is compiled natively
    // rather than bypassing metadata checks with -Xskip-metadata-version-check.
    implementation 'com.android.billingclient:billing-ktx:9.1.0'

    // Compile against the exact (possibly modified) Godot Android library used by the game.
    // Godot itself is not packaged into the plugin AAR.
    releaseCompileOnly fileTree(dir: 'libs/release', include: ['*.jar', '*.aar'])
    debugCompileOnly fileTree(dir: 'libs/debug', include: ['*.jar', '*.aar'])
}
