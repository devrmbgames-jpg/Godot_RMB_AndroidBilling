name: Build library artifact

on:
  workflow_dispatch:
  push:
    branches: [ 'master' ]
  pull_request:
    branches: [ 'master' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permissions for gradlew
        run: chmod +x gradlew

      - name: Build artifact
        run: ./gradlew :app:assembleRelease

      - name: Upload library package
        uses: actions/upload-artifact@v4
        with:
          name: GodotGoogleBilling-release
          path: app/build/outputs/aar/GodotGoogleBilling.release.aar
